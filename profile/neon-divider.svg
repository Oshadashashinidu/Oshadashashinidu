<svg width="1200" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon gradient divider">
  <defs>
    <linearGradient id="line" x1="0" y1="12" x2="1200" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.22" stop-color="#20C5FF"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="0.78" stop-color="#20C5FF"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-500%" width="120%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)" filter="url(#glow)" opacity="0.9"/>
  <circle cy="12" r="3" fill="#F0F6FC" filter="url(#glow)">
    <animate attributeName="cx" values="180;1020;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
