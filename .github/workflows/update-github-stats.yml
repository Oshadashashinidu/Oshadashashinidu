name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate complete GitHub statistics card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Oshadashashinidu&theme=tokyonight&hide_border=true&include_all_commits=true&number_format=long&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged&custom_title=All-Time%20GitHub%20Statistics
          path: profile/github-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-stats.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
