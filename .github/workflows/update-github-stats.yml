name: Update Total GitHub Contributions

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate total contributions card
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: Oshadashashinidu
        run: |
          python <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          TOKEN = os.environ.get("GH_STATS_TOKEN")
          USERNAME = os.environ.get("GITHUB_USERNAME")

          if not TOKEN:
              raise RuntimeError(
                  "GH_STATS_TOKEN is missing. Add it under "
                  "Settings > Secrets and variables > Actions."
              )

          if not USERNAME:
              raise RuntimeError("GITHUB_USERNAME is missing.")

          API_URL = "https://api.github.com/graphql"

          def graphql(query, variables):
              request_data = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode("utf-8")

              request = urllib.request.Request(
                  API_URL,
                  data=request_data,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "github-profile-contribution-card"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8")
                  raise RuntimeError(
                      f"GitHub API request failed: {error.code}\n{body}"
                  ) from error

              if result.get("errors"):
                  raise RuntimeError(
                      "GitHub GraphQL errors:\n"
                      + json.dumps(result["errors"], indent=2)
                  )

              return result["data"]

          profile_query = """
          query($login: String!) {
            user(login: $login) {
              createdAt

              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          profile_data = graphql(
              profile_query,
              {"login": USERNAME}
          )

          user = profile_data.get("user")

          if not user:
              raise RuntimeError(
                  f"GitHub user '{USERNAME}' was not found."
              )

          created_at = datetime.fromisoformat(
              user["createdAt"].replace("Z", "+00:00")
          )

          last_year_total = (
              user["contributionsCollection"]
              ["contributionCalendar"]
              ["totalContributions"]
          )

          yearly_query = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          now = datetime.now(timezone.utc)
          all_time_total = 0

          for year in range(created_at.year, now.year + 1):
              year_start = datetime(
                  year, 1, 1, 0, 0, 0,
                  tzinfo=timezone.utc
              )

              next_year = datetime(
                  year + 1, 1, 1, 0, 0, 0,
                  tzinfo=timezone.utc
              )

              start = max(created_at, year_start)
              end = min(
                  now,
                  next_year - timedelta(seconds=1)
              )

              if start > end:
                  continue

              year_data = graphql(
                  yearly_query,
                  {
                      "login": USERNAME,
                      "from": start.isoformat().replace("+00:00", "Z"),
                      "to": end.isoformat().replace("+00:00", "Z")
                  }
              )

              yearly_total = (
                  year_data["user"]
                  ["contributionsCollection"]
                  ["contributionCalendar"]
                  ["totalContributions"]
              )

              print(f"{year}: {yearly_total} contributions")
              all_time_total += yearly_total

          safe_username = html.escape(USERNAME)

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
            <title id="title">{safe_username} GitHub contribution journey</title>
            <desc id="desc">{all_time_total:,} all-time contributions and {last_year_total:,} contributions in the last 12 months, since {created_at.year}.</desc>
            <defs>
              <linearGradient id="border" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
                <stop stop-color="#20C5FF"/><stop offset="0.5" stop-color="#7C3AED"/><stop offset="1" stop-color="#A855F7"/>
                <animateTransform attributeName="gradientTransform" type="translate" values="-80 0;80 0;-80 0" dur="7s" repeatCount="indefinite"/>
              </linearGradient>
              <linearGradient id="number" x1="225" y1="123" x2="675" y2="218" gradientUnits="userSpaceOnUse">
                <stop stop-color="#20C5FF"/><stop offset="1" stop-color="#C084FC"/>
              </linearGradient>
              <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(105 40) rotate(42) scale(280 210)">
                <stop stop-color="#20C5FF" stop-opacity="0.18"/><stop offset="1" stop-color="#20C5FF" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(820 270) rotate(-140) scale(320 220)">
                <stop stop-color="#A855F7" stop-opacity="0.22"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
              </radialGradient>
              <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
                <path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.35"/>
                <animateTransform attributeName="patternTransform" type="translate" values="0 0;32 32" dur="12s" repeatCount="indefinite"/>
              </pattern>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <rect x="1" y="1" width="898" height="298" rx="24" fill="#0D1117" stroke="url(#border)" stroke-width="2"/>
            <rect x="5" y="5" width="890" height="290" rx="20" fill="none" stroke="url(#border)" stroke-width="1" stroke-dasharray="10 28" opacity="0.55">
              <animate attributeName="stroke-dashoffset" values="0;-152" dur="5s" repeatCount="indefinite"/>
            </rect>
            <rect x="2" y="2" width="896" height="296" rx="23" fill="url(#grid)"/>
            <rect x="2" y="2" width="896" height="296" rx="23" fill="url(#cyanGlow)"/>
            <rect x="2" y="2" width="896" height="296" rx="23" fill="url(#violetGlow)"/>

            <circle r="2.5" fill="#20C5FF" filter="url(#glow)" opacity="0.8">
              <animateMotion path="M80 76 C260 34 360 84 510 48 S760 84 840 45" dur="7s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
            </circle>
            <circle r="2" fill="#C084FC" filter="url(#glow)" opacity="0.7">
              <animateMotion path="M820 245 C690 218 610 262 470 238 S210 265 76 235" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0.9;0" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
            </circle>

            <circle cx="42" cy="39" r="5" fill="#20C5FF" filter="url(#glow)">
              <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <text x="60" y="45" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="2">CONTRIBUTION JOURNEY</text>
            <text x="858" y="44" text-anchor="end" fill="#8B949E" font-family="Consolas, monospace" font-size="14">@{safe_username}</text>
            <line x1="42" y1="70" x2="858" y2="70" stroke="url(#border)" stroke-opacity="0.42"/>

            <g>
              <rect x="42" y="92" width="391" height="132" rx="18" fill="#161B22" fill-opacity="0.82" stroke="#20C5FF" stroke-opacity="0.28"/>
              <text x="68" y="124" fill="#8B949E" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">ALL-TIME CONTRIBUTIONS</text>
              <text x="68" y="191" fill="url(#number)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800">{all_time_total:,}
                <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" repeatCount="indefinite"/>
              </text>
              <path d="M357 181l13-13 12 8 22-28" fill="none" stroke="#20C5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="72" filter="url(#glow)">
                <animate attributeName="stroke-dashoffset" values="72;0;0" keyTimes="0;0.55;1" dur="3.8s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.35;1" dur="3.8s" repeatCount="indefinite"/>
              </path>
              <circle cx="404" cy="148" r="4" fill="#20C5FF">
                <animate attributeName="r" values="3;6;3" dur="1.9s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.55;1;0.55" dur="1.9s" repeatCount="indefinite"/>
              </circle>
            </g>

            <g>
              <rect x="467" y="92" width="391" height="132" rx="18" fill="#161B22" fill-opacity="0.82" stroke="#A855F7" stroke-opacity="0.3"/>
              <text x="493" y="124" fill="#8B949E" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">LAST 12 MONTHS</text>
              <text x="493" y="191" fill="url(#number)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800">{last_year_total:,}
                <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
              </text>
              <g transform="translate(755 151)">
                <rect x="0" y="22" width="11" height="18" rx="3" fill="#7C3AED" opacity="0.55">
                  <animate attributeName="height" values="18;28;18" dur="2.8s" begin="-0.2s" repeatCount="indefinite"/>
                  <animate attributeName="y" values="22;12;22" dur="2.8s" begin="-0.2s" repeatCount="indefinite"/>
                </rect>
                <rect x="18" y="12" width="11" height="28" rx="3" fill="#8B5CF6" opacity="0.7">
                  <animate attributeName="height" values="28;39;28" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
                  <animate attributeName="y" values="12;1;12" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
                </rect>
                <rect x="36" y="2" width="11" height="38" rx="3" fill="#A855F7">
                  <animate attributeName="height" values="38;49;38" dur="2.8s" begin="-1s" repeatCount="indefinite"/>
                  <animate attributeName="y" values="2;-9;2" dur="2.8s" begin="-1s" repeatCount="indefinite"/>
                </rect>
                <rect x="54" y="-11" width="11" height="51" rx="3" fill="#C084FC" filter="url(#glow)">
                  <animate attributeName="height" values="51;59;51" dur="2.6s" repeatCount="indefinite"/>
                  <animate attributeName="y" values="-11;-19;-11" dur="2.6s" repeatCount="indefinite"/>
                </rect>
              </g>
            </g>

            <circle cx="45" cy="261" r="3" fill="#3FB950" filter="url(#glow)">
              <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/>
            </circle>
            <text x="58" y="266" fill="#8B949E" font-family="Consolas, monospace" font-size="14">Tracking contributions since {created_at.year}</text>
            <text x="858" y="266" text-anchor="end" fill="#8B949E" font-family="Consolas, monospace" font-size="14">Updated automatically every 6 hours</text>
          </svg>
          """

          output_path = Path(
              "profile/total-contributions.svg"
          )

          output_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output_path.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"All-time contributions: {all_time_total}"
          )

          print(
              f"Last 12 months: {last_year_total}"
          )
          PY

      - name: Commit updated contribution card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/total-contributions.svg

          if git diff --cached --quiet; then
            echo "No contribution changes detected."
          else
            git commit -m "Update total GitHub contributions"
            git push
          fi
